# Gitea 访问配置（可选）。url 与 token 都不填则跳过连通性校验；拉取 Gitea 制品时仍需要
gitea:
  url: # http://127.0.0.1:3000
  token: # ${GITEA_TOKEN}  或直接写明文 token

# GitHub 访问配置（可选）。token 不填则跳过连通性校验；package.source=github 时必填
github:
  token: # ${GH_TOKEN}  或直接写明文 PAT
  # username: Crayon-hua        # GHCR docker login 用户名（仅 GitHub 镜像需要；Gitea 不登录）
  # url: https://api.github.com
  # registry: ghcr.io

logs:
  max-log-history: 10
  level: deploy

hooks:
  on-agent-start: "echo agent-start：${hook_current_time}"

scripts:
  reload-nginx-cmd: "nginx -s reload"
  # package 流程总超时（秒）；generic 与 docker-container 均适用
  package-timeout-seconds: 60

services:

  - name: frontend
    package:
      type: generic
      # source: gitea            # 省略默认为 gitea；GitHub Actions artifact 设为 github
      # repo: ihxy-blog          # source=github 时必填（仓库名，不含 owner）
      owner: OwnerName
      name: PackageName
      file: dist.zip
    deploy:
      strategy: frontend-dist
      target: /data/nginx/web/my-website

  - name: docker-compose-backend
    package:
      type: docker-container
      # source: github           # 省略默认为 gitea；GHCR 设为 github（ghcr.io/{owner}/{name}）
      owner: OwnerName
      name: PackageName
    deploy:
      strategy: docker-compose
      compose: /data/docker/compose/my-backend-1/docker-compose.yml
      service: backend
      started-check-seconds: 3

  # 可与上一 service 共享同一 compose 文件，但 compose+service 组合须全局唯一
  - name: docker-compose-backend-2
    package:
      type: docker-container
      owner: OwnerName
      name: AnotherPackageName
    deploy:
      strategy: docker-compose
      compose: /data/docker/compose/my-backend-1/docker-compose.yml
      service: backend-2
      started-check-seconds: 5

  - name: docker-run-backend
    package:
      type: docker-container
      owner: OwnerName
      name: DockerRunPackageName
    deploy:
      strategy: docker-run
      started-check-seconds: 5
      containers:
        - options: >-
            --name my-api
            -p 8080:8080
            --restart unless-stopped
            --network my-host
